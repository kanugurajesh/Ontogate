[project]
name = "ontogate-agent-runtime"
version = "0.1.0"
description = "A from-scratch enterprise agent runtime: ontology-grounded planning, async DAG orchestration, memory, caching, checkpointed fault tolerance, and tracing."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.30"]
pretty = ["rich>=13.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ontogate*"]
